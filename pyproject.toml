[project]
name = "typer-di"
version = "0.1.8"
description = "Extension for `typer` for dependency injection like in FastAPI"
requires-python = ">=3.13"
readme = "README.md"
authors = [
    {name = "Evgeniy A. Cymbalyuk", email = "cimbaluk@gmail.com"},
    {name = "krageon", email = "git@voor.money"},
]
license-files = [
    "LICENSES/*.txt",
]

classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]

packages = [{ include = "typer_di", from = "src" }]
dependencies = [
    "typer>=0.23.1",
]

[tool.pytest.ini_options]
addopts = ["--cov=.", "--cov-report=term", "--cov-report=xml"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.report]
show_missing = true
skip_empty = true
skip_covered = true
sort = "cover"
exclude_lines = ["if TYPE_CHECKING:", "\\.\\.\\.", "# pragma: no cover"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
mypy_path = "src"
packages = "typer_di"
strict = true

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
